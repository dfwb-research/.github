name: Feature request
description: Suggest a change or an addition.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How it could work. Command lines or config snippets help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - core / plugins / config
        - protocols
        - preprocess
        - data / models / train
        - score / eval
        - zoo
        - cli
        - dfwb-torch utilities
        - documentation
    validations:
      required: true
