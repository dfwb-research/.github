labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Float an idea before it becomes a feature request. Rough is fine.
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like DFWB to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: The research or workflow problem it would solve.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
