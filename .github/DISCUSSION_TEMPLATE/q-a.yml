labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        Ask how to do something with a DFWB package. Please never attach dataset media
        (videos, frames or audio).
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to do, and where did you get stuck?
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you've tried
      description: Commands, config snippets, or the docs you followed.
      render: shell
  - type: textarea
    id: doctor
    attributes:
      label: Output of `dfwb doctor --json`
      description: Optional, but it saves a round trip. Remove any paths you consider private.
      render: json
