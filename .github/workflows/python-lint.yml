# Reusable: attribution check (no Co-Authored-By / AI-attribution trailers), ruff, ruff format
# and mypy for a uv project.
# Callers: uses: dfwb-research/.github/.github/workflows/python-lint.yml@v1
# The caller's pyproject.toml configures ruff and mypy (mypy runs with no arguments).
name: python-lint

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory that holds pyproject.toml.
        type: string
        default: "."
      python-version:
        description: Python used for linting and type checking.
        type: string
        default: "3.12"

permissions:
  contents: read

jobs:
  attribution:
    name: attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject AI/bot attribution in commit messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "${PUSH_BEFORE:-}" ] && ! [[ "$PUSH_BEFORE" =~ ^0+$ ]] \
              && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            range="$PUSH_BEFORE..$HEAD_SHA"
          else
            range="$HEAD_SHA"  # new branch, force-push or unknown base: check the whole history
          fi
          commits=$(git rev-list "$range")  # an unresolvable range fails the step (fail closed)
          pattern='^[[:space:]]*co-authored-by:|generated with \[?claude|🤖 generated'
          bad=""
          for sha in $commits; do
            if git log -1 --format=%B "$sha" | grep -qiE "$pattern"; then
              bad="$bad $sha"
            fi
          done
          if [ -n "$bad" ]; then
            for sha in $bad; do
              echo "::error::commit $sha carries an attribution trailer (Co-Authored-By / 'Generated with')"
            done
            exit 1
          fi
          echo "no attribution trailers in $range"

  lint:
    name: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ inputs.python-version }}
          working-directory: ${{ inputs.working-directory }}
      - name: Sync the locked environment
        run: uv sync --locked
      - name: ruff check
        run: uv run --no-sync ruff check
      - name: ruff format --check
        run: uv run --no-sync ruff format --check
      - name: mypy
        run: uv run --no-sync mypy
