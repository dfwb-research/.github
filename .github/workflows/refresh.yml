# Weekly refresh of the profile: package cards (version, licence, CI once a repository is public
# and released), dataset and detector tables, citations, contributors, and the status line.
# main takes changes only through pull requests, so the refresh proposes its update as one: it
# commits to the profile-refresh branch, opens a pull request (or updates the open one) and
# starts CI on the branch, because pushes and pull requests made with GITHUB_TOKEN start no
# workflow runs by themselves. The status line moves at most every 28 days, so a pull request
# turns up about monthly; merging it keeps this public repository inside GitHub's 60-day
# activity window. The refresh script validates its output before anything is committed.
name: refresh

on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the profile-refresh branch; main itself stays pull-request only
      pull-requests: write # open or retitle the refresh pull request
      actions: write # start CI on the branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: Refresh, rebuild and validate
        id: refresh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run scripts/refresh_profile.py
      - name: Propose the update as a pull request
        if: steps.refresh.outputs.commit == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WHAT: ${{ steps.refresh.outputs.what }}
          BRANCH: profile-refresh
        run: |
          set -euo pipefail
          git add profile
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          title="chore(profile): refresh ${WHAT}"
          git commit -m "$title"
          # Rebuilt from main every run, so an unmerged refresh never goes stale or conflicts.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::${auth}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push --force origin "HEAD:refs/heads/${BRANCH}"
          open="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$open" ]; then
            gh pr edit "$open" --title "$title"
          else
            gh pr create --base main --head "$BRANCH" --title "$title" \
              --body "The weekly refresh found changes to the profile. CI runs on this branch; merge it once CI passes."
          fi
          gh workflow run ci.yml --ref "$BRANCH"
