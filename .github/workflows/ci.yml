# Checks for this repository itself: attribution, workflow and template lint, form schemas,
# and the profile's generators (lint, types, tests, a reproducible build).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: The attribution step of both workflows rejects trailers and accepts clean history
        run: |
          uv run --no-project --with pyyaml python tests/attribution_check.py .github/workflows/python-lint.yml attribution
          uv run --no-project --with pyyaml python tests/attribution_check.py .github/workflows/ci.yml lint
      - name: Reject AI/bot attribution in commit messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "${PUSH_BEFORE:-}" ] && ! [[ "$PUSH_BEFORE" =~ ^0+$ ]] \
              && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            range="$PUSH_BEFORE..$HEAD_SHA"
          else
            range="$HEAD_SHA"  # new branch, force-push or unknown base: check the whole history
          fi
          commits=$(git rev-list "$range")  # an unresolvable range fails the step (fail closed)
          pattern='^[[:space:]]*co-authored-by:|generated with \[?claude|🤖 generated'
          bad=""
          for sha in $commits; do
            if git log -1 --format=%B "$sha" | grep -qiE "$pattern"; then
              bad="$bad $sha"
            fi
          done
          if [ -n "$bad" ]; then
            for sha in $bad; do
              echo "::error::commit $sha carries an attribution trailer (Co-Authored-By / 'Generated with')"
            done
            exit 1
          fi
          echo "no attribution trailers in $range"
      - name: actionlint
        run: |
          uv tool run --from actionlint-py==1.7.12.25 actionlint
          uv tool run --from actionlint-py==1.7.12.25 actionlint workflow-templates/*.yml
      - name: zizmor
        run: |
          uv tool run zizmor==1.30.1 --persona regular .github/workflows
          uv tool run zizmor==1.30.1 --persona regular workflow-templates/*.yml
      - name: Issue forms match GitHub's schema
        run: |
          uv tool run check-jsonschema==0.38.2 --builtin-schema vendor.github-issue-forms \
            .github/ISSUE_TEMPLATE/bug_report.yml .github/ISSUE_TEMPLATE/feature_request.yml \
            .github/ISSUE_TEMPLATE/new_dataset_protocol.yml .github/ISSUE_TEMPLATE/new_zoo_adapter.yml
          uv tool run check-jsonschema==0.38.2 --builtin-schema vendor.github-issue-config \
            .github/ISSUE_TEMPLATE/config.yml
      - name: Discussion forms match GitHub's schema
        run: |
          uv tool run check-jsonschema==0.38.2 --builtin-schema vendor.github-discussion \
            .github/DISCUSSION_TEMPLATE/*.yml
      - name: Workflow template properties are valid JSON with a name and description
        run: |
          for f in workflow-templates/*.properties.json; do
            python3 -c 'import json, sys; d = json.load(open(sys.argv[1])); assert d["name"] and d["description"], sys.argv[1]' "$f"
            [ -f "${f%.properties.json}.yml" ] || { echo "::error::$f has no matching workflow"; exit 1; }
          done

  profile:
    name: profile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: Sync the locked environment
        run: uv sync --locked
      - name: ruff
        run: |
          uv run --no-sync ruff check
          uv run --no-sync ruff format --check
      - name: mypy
        run: uv run --no-sync mypy
      - name: pytest
        run: uv run --no-sync pytest
      - name: Committed profile equals a fresh build
        run: uv run scripts/build_profile.py --check
      - name: Every SVG is well-formed (xmllint)
        run: |
          if ! command -v xmllint >/dev/null; then
            sudo apt-get update -q && sudo apt-get install -y -q libxml2-utils
          fi
          find profile/assets -name '*.svg' -print0 | xargs -0 xmllint --noout
