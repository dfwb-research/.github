# Datasets DFWB publishes protocols for. Media is never distributed: each dataset comes from its
# owner, under the owner's terms. Add a row only when dfwb-protocols' own registry has it, and
# take every fact from that pack: the rows must agree with the table dfwb-protocols generates for
# its README (scripts/dataset_table.py there), cell for cell.
#
#   - name: Example-DF              # dataset name, as its owners write it
#     repository: https://example.org/  # optional: the owner's page the name links to
#     year: 2021                    # optional: the year of the paper the dataset's card cites
#     modality: video               # video | image | audio | audio-visual
#     real: 1000                    # unique real videos the protocol lists (binary label 0)
#     fake: 5000                    # unique fake videos the protocol lists (binary label 1)
#     subjects: 100                 # optional: distinct people, only if every identity is one
#     methods: [A, B]               # the distinct method labels of the fakes
#     variants: [raw, c23]          # optional: the compressions the protocol lists videos at
#     variants_of: fakes            # optional: fakes | reals, when only they come in variants
#     default_protocol: official    # the card's default scheme
#     rights_cleared: false         # true only once DFWB publishes the dataset's lists
#     protocol_version: "1.0"       # the dfwb-protocols version that defines the splits
#     terms: https://example.org/   # the owner's access terms
#     status: released              # released | in preparation
