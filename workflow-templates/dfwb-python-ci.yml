# Lint, type-check, test and build a uv project with the dfwb-research reusable workflows.
# Tune the test matrix with `with:` (python-versions, torch-versions, extras, os, coverage-min);
# see the header of each reusable workflow for its inputs.
name: ci

on:
  push:
    branches: [$default-branch]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: dfwb-research/.github/.github/workflows/python-lint.yml@v1
  test:
    uses: dfwb-research/.github/.github/workflows/python-test.yml@v1
  build:
    uses: dfwb-research/.github/.github/workflows/python-build.yml@v1
