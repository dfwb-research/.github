# Build with the dfwb-research reusable workflow, then publish to PyPI with trusted publishing.
# PyPI trusted publishing cannot run from a reusable workflow, so the publish job lives here.
# Before the first release, add this repository as a trusted publisher on PyPI (environment
# "pypi") and create the "pypi" environment under Settings -> Environments.
name: release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: dfwb-research/.github/.github/workflows/python-build.yml@v1

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
